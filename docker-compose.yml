services:
  backend:
    build: ./backend
    container_name: esih-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4101
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/esih?schema=public
      PORTAL_API_URL: http://portal:3001
      SSO_INTERNAL_TOKEN: ${SSO_INTERNAL_TOKEN:?SSO_INTERNAL_TOKEN wajib diatur di .env}
      TARGET_APP_ID: 77777777-7777-4777-8777-777777777777
      TARGET_FRONTEND_ORIGIN: http://localhost:4100
      ALLOWED_ORIGINS: ""
      SESSION_SECRET_HEX: ${SESSION_SECRET_HEX:?SESSION_SECRET_HEX wajib diatur di .env}
      COOKIE_NAME: target_session
      COOKIE_MAX_AGE_SECONDS: 1800
    ports:
      - "4101:4101"
    networks:
      - default
      - esih

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_PORTAL_URL: http://localhost:3001
        NEXT_PUBLIC_PORTAL_LOGIN_URL: http://localhost:3001/login
        NEXT_PUBLIC_TARGET_APP_ID: 77777777-7777-4777-8777-777777777777
        NEXT_PUBLIC_APP_NAME: e-SIH Operation
        NEXT_PUBLIC_APP_DESCRIPTION: System Highlight Report & Activity Tracking - PT Industri Nabati Lestari
        NEXT_PUBLIC_APP_LOGO_URL: /app-logo.svg
        NEXT_PUBLIC_PORTAL_NAME: InTes / Portal SSO
        NEXT_PUBLIC_PORTAL_ACCOUNT_NAME: Portal INL
        NEXT_PUBLIC_BACKEND_DRIVER: fastify
    container_name: esih-frontend
    restart: unless-stopped
    ports:
      - "4100:4100"

networks:
  esih:
    name: e-sih_default
    external: true
